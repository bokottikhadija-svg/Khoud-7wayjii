<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoud-7wayji | Boutique d'Échange & Seconde Main</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --balna-bg: #fdfdfb;
            --balna-accent: #0d0d0d;
            --balna-border: #e8e8e3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--balna-bg);
            color: var(--balna-accent);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            scroll-behavior: smooth;
            padding-bottom: 60px;
        }

        h1, h2, h3, .serif {
            font-family: 'Cormorant Garamond', serif;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.98);
            z-index: 10000;
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            position: relative;
            margin: auto;
        }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            color: #4a4a4a;
        }

        .input-classic {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d1cf;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-classic:focus { border-color: black; }

        .btn-black {
            background: var(--balna-accent);
            color: white;
            width: 100%;
            padding: 16px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: opacity 0.3s;
            display: block;
            text-align: center;
        }

        .btn-black:hover { opacity: 0.9; }

        .btn-outline {
            background: transparent;
            color: black;
            border: 1px solid black;
            width: 100%;
            padding: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .file-upload-wrapper {
            border: 2px dashed #d1d1cf;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            background: #fafafa;
        }

        .market-locker {
            height: 60vh;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .market-locker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .market-locker:hover img { transform: scale(1.05); }

        .locker-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2.5rem;
        }

        .whatsapp-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #25D366;
            color: white;
            padding: 15px;
            text-align: center;
            z-index: 9999;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="sticky top-0 z-[100] bg-white border-b border-[#f0f0ed]">
        <div class="max-w-[1600px] mx-auto px-6 lg:px-16">
            <div class="flex justify-between items-center h-24 lg:h-32">
                <!-- Logo -->
                <div class="flex items-center space-x-4 lg:space-x-8 cursor-pointer" onclick="location.reload()">
                    <div class="w-12 h-12 lg:w-16 lg:h-16 border border-black flex items-center justify-center overflow-hidden bg-white">
                        <!-- CORRECTION CHEMIN LOGO : Utilisez des tirets au lieu d'espaces et vérifiez l'extension -->
                        <img src="assets/logo-marque.jpg" alt="KHOUD-7WAYJI" class="w-full h-full object-cover" onerror="this.src='https://api.placeholder.com/100/100?text=KH'">
                    </div>
                    <div class="flex flex-col">
                        <span class="serif text-xl lg:text-3xl font-bold tracking-tighter uppercase">KHOUD-7WAYJI</span>
                        <span class="text-[7px] lg:text-[8px] tracking-[0.5em] uppercase opacity-50 font-bold">L-STYLE DYALEK</span>
                    </div>
                </div>

                <div class="flex items-center space-x-4 lg:space-x-12">
                    <a href="https://www.instagram.com/khoud_7wayji/" target="_blank" class="flex items-center gap-2 text-[10px] lg:text-[11px] font-bold uppercase tracking-widest hover:opacity-50">
                        <i class="fa-brands fa-instagram text-lg"></i>
                        <span class="hidden lg:inline">Instagram</span>
                    </a>
                    <button id="navLoginBtn" onclick="openModal('loginModal')" class="text-[10px] lg:text-[11px] font-bold uppercase tracking-widest hover:opacity-50">Connexion</button>
                    <button id="navSignupBtn" onclick="openModal('signupChoiceModal')" class="text-[10px] lg:text-[11px] font-bold uppercase tracking-widest border-2 border-black px-4 lg:px-8 py-3 lg:py-4 hover:bg-black hover:text-white transition-all">S'inscrire</button>
                    <button id="logoutBtn" onclick="handleLogout()" class="hidden text-[10px] lg:text-[11px] font-bold uppercase tracking-widest text-red-500">Déconnexion</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="pt-16 lg:pt-24 pb-12 px-8 text-center">
        <h1 class="text-5xl md:text-[8rem] font-medium leading-[0.85] tracking-tighter mb-8">
            No cash?<br>
            <span class="italic font-light">No drama.</span>
        </h1>
        <p class="serif text-xl lg:text-2xl italic text-gray-400">Khoud l-stlyle, flex l-vibe!</p>
    </header>

    <!-- Sections Catégories -->
    <section class="max-w-[1400px] mx-auto px-6 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="market-locker group" onclick="filterGallery('homme')">
                <img src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&q=80&w=1200" alt="Hommes">
                <div class="locker-overlay text-white">
                    <h2 class="serif text-4xl lg:text-5xl italic">Hommes</h2>
                    <p class="text-[9px] uppercase tracking-widest mt-2">Explorer le vestiaire</p>
                </div>
            </div>
            <div class="market-locker group" onclick="filterGallery('femme')">
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&q=80&w=1200" alt="Femmes">
                <div class="locker-overlay text-white">
                    <h2 class="serif text-4xl lg:text-5xl italic">Femmes</h2>
                    <p class="text-[9px] uppercase tracking-widest mt-2">Explorer le vestiaire</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Galerie Marché -->
    <main id="market-section" class="max-w-[1400px] mx-auto px-6 py-12 border-t border-gray-100 mt-8">
        <div class="flex justify-between items-end mb-12">
            <h3 id="galleryTitle" class="serif text-3xl lg:text-4xl italic">Dernières pépites</h3>
            <div id="dropCount" class="text-[10px] uppercase tracking-widest font-bold">0 Article</div>
        </div>
        <div id="galleryContainer" class="grid grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-8">
            <!-- Articles injectés ici -->
        </div>
        <div class="mt-20 flex flex-col items-center">
            <button onclick="checkAuthAndOpenDeposit()" class="bg-black text-white px-10 lg:px-12 py-5 text-[10px] lg:text-[11px] font-bold uppercase tracking-[0.3em] hover:opacity-80 transition-all shadow-xl">Déposer un article</button>
            <p class="text-[9px] uppercase tracking-widest text-gray-400 mt-4 text-center">Vente réservée aux membres inscrits</p>
        </div>
    </main>

    <!-- WhatsApp Bar -->
    <a href="https://wa.me/212773515753" target="_blank" class="whatsapp-bar">
        <i class="fa-brands fa-whatsapp text-xl"></i>
        WhatsApp : 0773515753
    </a>

    <!-- Modals (Structure simplifiée pour l'exemple) -->
    <div id="signupChoiceModal" class="modal"><div class="modal-content"><button onclick="closeModal('signupChoiceModal')" class="absolute top-6 right-6 text-2xl">&times;</button><h2 class="serif text-3xl mb-8 italic">Rejoignez-nous</h2><button onclick="closeModal('signupChoiceModal'); openModal('signupModal');" class="btn-black">Créer un compte</button></div></div>
    
    <div id="loginModal" class="modal"><div class="modal-content"><button onclick="closeModal('loginModal')" class="absolute top-6 right-6 text-2xl">&times;</button><h2 class="serif text-3xl mb-8 italic">Connexion</h2><form id="loginForm"><input type="email" id="loginEmail" placeholder="Email" class="input-classic mb-4" required><input type="password" id="loginPass" placeholder="Mot de passe" class="input-classic mb-4" required><button type="submit" class="btn-black">Entrer</button></form></div></div>

    <div id="signupModal" class="modal"><div class="modal-content"><button onclick="closeModal('signupModal')" class="absolute top-6 right-6 text-2xl">&times;</button><h2 class="serif text-3xl mb-8 italic">Inscription</h2><form id="signupForm"><input type="email" id="regEmail" placeholder="Email" class="input-classic mb-4" required><input type="text" id="regFName" placeholder="Prénom" class="input-classic mb-4"><input type="password" id="regPass" placeholder="Mot de passe" class="input-classic mb-4" required><button type="submit" class="btn-black">S'inscrire</button></form></div></div>

    <div id="depositModal" class="modal"><div class="modal-content"><button onclick="closeModal('depositModal')" class="absolute top-6 right-6 text-2xl">&times;</button><h2 class="serif text-3xl mb-6 italic">Nouvel article</h2><form id="depositForm"><input type="text" id="itemName" placeholder="Nom de l'objet" class="input-classic mb-4" required><select id="itemCategory" class="input-classic mb-4"><option value="homme">Homme</option><option value="femme">Femme</option></select><input type="number" id="itemPrice" placeholder="Prix MAD" class="input-classic mb-6" required><button type="submit" class="btn-black">Publier</button></form></div></div>

    <div id="alertBox" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[15000] opacity-0 transition-all pointer-events-none"><div class="bg-black text-white px-8 py-4 shadow-2xl text-[10px] font-bold uppercase tracking-widest"><span id="alertMessage"></span></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURATION
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { /* Vos clés ici si hors environnement */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'khoud-7wayji-demo';

        let currentUser = null;

        // --- ATTACHEMENT DES FONCTIONS AU WINDOW (CRUCIAL POUR GITHUB/MODULES) ---
        window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; document.body.style.overflow = 'hidden'; };
        window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; document.body.style.overflow = 'auto'; };
        
        window.showAlert = (msg) => {
            const box = document.getElementById('alertBox');
            document.getElementById('alertMessage').textContent = msg;
            box.classList.remove('opacity-0');
            setTimeout(() => box.classList.add('opacity-0'), 3000);
        };

        window.handleLogout = () => signOut(auth).then(() => showAlert("Déconnecté."));

        window.checkAuthAndOpenDeposit = () => {
            if(!currentUser) { showAlert("Veuillez vous connecter."); openModal('signupChoiceModal'); }
            else { openModal('depositModal'); }
        };

        window.filterGallery = (cat) => {
            document.getElementById('galleryTitle').textContent = cat === 'homme' ? "Vestiaire Hommes" : "Vestiaire Femmes";
            document.getElementById('market-section').scrollIntoView({ behavior: 'smooth' });
            loadGallery(cat);
        };

        // GESTION AUTH
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            document.getElementById('navLoginBtn').classList.toggle('hidden', !!user);
            document.getElementById('navSignupBtn').classList.toggle('hidden', !!user);
            document.getElementById('logoutBtn').classList.toggle('hidden', !user);
            loadGallery();
        });

        // CHARGEMENT GALERIE
        function loadGallery(filter = 'all') {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'articles'));
            onSnapshot(q, (snap) => {
                const container = document.getElementById('galleryContainer');
                let html = "";
                let count = 0;
                snap.forEach(doc => {
                    const i = doc.data();
                    if (filter === 'all' || i.category === filter) {
                        count++;
                        html += `
                            <div class="group">
                                <div class="aspect-[3/4] bg-gray-100 mb-4 overflow-hidden relative">
                                    <img src="${i.imageUrl || 'https://api.placeholder.com/300/400'}" class="w-full h-full object-cover group-hover:scale-105 transition-all">
                                </div>
                                <h4 class="serif text-xl font-bold">${i.name}</h4>
                                <p class="text-[10px] font-bold mt-1">${i.price} MAD</p>
                                <button onclick="window.open('https://wa.me/212773515753?text=Intéressé par : ${i.name}', '_blank')" class="mt-2 text-[8px] uppercase font-bold border-b border-black">Acheter</button>
                            </div>
                        `;
                    }
                });
                container.innerHTML = html || '<p class="col-span-full text-center opacity-50 py-12">Bientôt de nouveaux articles.</p>';
                document.getElementById('dropCount').textContent = count + " Article(s)";
            });
        }

        // FORMULAIRES
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
                closeModal('loginModal');
            } catch(e) { showAlert("Erreur de connexion"); }
        };

        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value, document.getElementById('regPass').value);
                closeModal('signupModal');
                showAlert("Bienvenue !");
            } catch(e) { showAlert("Erreur d'inscription"); }
        };

        document.getElementById('depositForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!currentUser) return;
            const data = {
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                price: document.getElementById('itemPrice').value,
                createdAt: serverTimestamp(),
                sellerId: currentUser.uid
            };
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'articles'), data);
                closeModal('depositModal');
                showAlert("Article publié !");
            } catch(e) { showAlert("Erreur lors du dépôt"); }
        };
    </script>
</body>
</html>
